name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

# PR은 최신 커밋만 검사(이전 실행 취소). main 푸시 run은 취소 금지 —
# 포크 미러 푸시와 Deploy Hook 사이에 취소되면 Render가 stale 상태로 남는다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# 이 워크플로 파일 자체도 포크(hellinii)로 미러된다. 미러는 PAT 푸시라
# 포크에서도 push 이벤트가 발생해 CI가 한 번 더 돈다 — 그런데 포크에는
# FORK_SYNC_TOKEN / RENDER_DEPLOY_HOOK 시크릿이 없어 deploy가 빈 토큰으로
# 자기 자신에게 푸시하다 항상 인증 실패(exit 128)한다. 포크 main은 배포
# 미러일 뿐이고 내용은 이미 팀 repo CI를 통과했으므로, 팀 repo에서만 실행한다.
jobs:
  test:
    if: github.repository == 'hwanginyong02/Capstone_Back'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # render.yaml PYTHON_VERSION=3.12.13과 동일 마이너
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: 의존성 설치
        run: pip install -r requirements-dev.txt # -r requirements.txt 포함
      - name: 테스트
        run: pytest -q
      - name: 앱 부팅 검증 (Render 대시보드 Start Command와 문자 그대로 동일하게 유지할 것)
        env:
          DATABASE_URL: sqlite:///./ci-boot.db
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          UV_PID=$!
          ok=0
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8000/health; then ok=1; break; fi
            sleep 1
          done
          [ "$ok" = "1" ] || { kill $UV_PID; echo "::error::/health 응답 실패"; exit 1; }
          curl -fsS http://localhost:8000/api/organization   # DB init+seed 왕복 스모크
          # report/report_snapshot 테이블 왕복 스모크.
          # organization 만 치면 report 계열 스키마 드리프트가 그대로 통과한다 —
          # create_all 은 기존 테이블에 컬럼을 추가하지 못하므로(마이그레이션 도구 부재),
          # 그 사고는 배포 후 첫 쿼리에서야 드러난다. 여기서 잡는다.
          curl -fsS -X POST http://localhost:8000/api/reports/issue \
            -H 'Content-Type: application/json' \
            -d '{"run_id":"ci-smoke","model_name":"ci","content":{"smoke":true}}' > /tmp/issued.json
          NO=$(python -c "import json;print(json.load(open('/tmp/issued.json'))['report_no'])")
          curl -fsS "http://localhost:8000/api/reports/${NO}"          # 발급정보 조회
          curl -fsS "http://localhost:8000/api/reports/${NO}/content"  # 성적서 원본 복원
          # 서술 작업 번호 왕복(서술 라운드 S3a) — 키 없이 POST → GET 완료, AI 칸 없이 규칙 문장(fallback)·고정 문구(fixed)만.
          # 7.3(추가 관찰 없음)·9(문제 없음)는 키가 없어도 고정 문구라 'fixed' 다 — 'fallback' 만 허용하면 늘 빨갛다.
          # narrative_jobs 표가 init_db 로 생기는지, 응답 뒤에 도는 BackgroundTasks 가 실제 서버에서 끝까지
          # 가는지 본다(테스트의 TestClient 는 백그라운드 작업을 응답 전에 돌려 이 차이를 못 본다).
          curl -fsS -X POST http://localhost:8000/api/narrative/jobs \
            -H 'Content-Type: application/json' \
            -d '{"task_type":"binary","fact_sheet":{"n_samples":10,"verdict":"PASS","score":100,"metrics":[{"metric_id":"M1","display_name":"Accuracy","value":0.9,"threshold":0.8,"status":"pass","is_core":true}]}}' > /tmp/job.json
          JOB=$(python -c "import json;print(json.load(open('/tmp/job.json'))['job_id'])")
          done_ok=0
          for i in $(seq 1 20); do
            curl -fsS "http://localhost:8000/api/narrative/jobs/${JOB}" > /tmp/job_view.json
            if python -c "import json,sys;v=json.load(open('/tmp/job_view.json'));sys.exit(0 if v['status']=='done' else 1)"; then done_ok=1; break; fi
            sleep 1
          done
          [ "$done_ok" = "1" ] || { kill $UV_PID; cat /tmp/job_view.json; echo "::error::서술 작업이 완료되지 않음"; exit 1; }
          python -c "import json,sys;v=json.load(open('/tmp/job_view.json'));s=set(v['result']['section_sources'].values());sys.exit(0 if 'fallback' in s and s<={'fallback','fixed'} else 1)" \
            || { kill $UV_PID; cat /tmp/job_view.json; echo "::error::키 없는 서술 작업이 규칙 문장이 아님"; exit 1; }
          kill $UV_PID

  # 팀 main 푸시가 CI를 통과했을 때만: 포크(hellinii) main 미러 → Render Deploy Hook.
  # Render는 hellinii/Capstone_Back main을 추적하며 autoDeploy:false 이므로
  # 이 훅 호출이 유일한 배포 경로다. 포크 main은 순수 배포 미러 — 직접 커밋 금지.
  deploy:
    needs: test
    if: >-
      github.repository == 'hwanginyong02/Capstone_Back'
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # shallow clone에서의 push는 GitHub이 거부
          # 기본값(true)이면 GITHUB_TOKEN이 git extraheader로 남아 푸시 URL의
          # FORK_SYNC_TOKEN을 덮어써 403이 난다 — 포크 푸시엔 PAT만 써야 함.
          persist-credentials: false
      - name: 팀 main → 포크 main 미러
        run: |
          if [ -z "${FORK_SYNC_TOKEN}" ]; then
            echo "::error::FORK_SYNC_TOKEN 시크릿이 비어 있습니다. Settings → Secrets and variables → Actions 에서 등록하세요."
            exit 1
          fi
          git push --force \
            "https://x-access-token:${FORK_SYNC_TOKEN}@github.com/hellinii/Capstone_Back.git" \
            HEAD:main
        env:
          FORK_SYNC_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
      - name: Render 배포 트리거
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "${RENDER_DEPLOY_HOOK}" ]; then
            echo "::error::RENDER_DEPLOY_HOOK 시크릿이 비어 있습니다. Settings → Secrets and variables → Actions 에서 등록하세요."
            exit 1
          fi
          curl -fsS -X POST "${RENDER_DEPLOY_HOOK}"

      # Deploy Hook 은 "빌드를 시작하라"는 신호일 뿐이다. 호출이 200 이어도 빌드가
      # 실패하거나 새 리비전이 기동에 실패하면 **옛 리비전이 계속 떠 있고** CI 는
      # 초록으로 끝난다 — 배포됐다고 믿는 것과 실제가 갈린다(H-08).
      # 새 커밋이 실제로 서비스되는지까지 확인해야 게이트가 성립한다.
      - name: 배포 완료 확인 (새 리비전이 실제로 응답하는가)
        env:
          HEALTH_URL: https://capstone-back-59z8.onrender.com/health
          EXPECTED: ${{ github.sha }}
        run: |
          want="${EXPECTED:0:7}"
          echo "커밋 ${want} 리비전이 응답하기를 기다립니다 (최대 15분)..."
          for i in $(seq 1 90); do
            # Render free 는 콜드스타트가 길어 타임아웃을 넉넉히 준다.
            body=$(curl -fsS --max-time 60 "${HEALTH_URL}" 2>/dev/null || true)
            if [ -n "${body}" ]; then
              got=$(printf '%s' "${body}" | python3 -c "import json,sys;print(json.load(sys.stdin).get('commit') or '')" 2>/dev/null || true)
              # 옛 리비전(빌드 중·빌드 실패)도 200 으로 응답한다 — 커밋이 같아질 때까지 기다린다.
              # commit 칸이 null 이면 Render 가 RENDER_GIT_COMMIT 을 주지 않는 것이다: 경고만 남기고 확인을 끝낸다.
              if [ "${got}" = "${want}" ] || printf '%s' "${body}" | grep -q '"commit":null'; then
                echo "응답: ${body}"
                [ "${got}" = "${want}" ] || echo "::warning::/health 에 커밋이 없습니다 — 배포 커밋은 Render 대시보드에서 확인하세요."
                # 영속 DB 로 붙어 있는지도 함께 본다 — 휘발성으로 강등되면 재시작마다
                # 채번 시퀀스와 발급된 성적서 보관본이 사라진다(G-07).
                if echo "${body}" | grep -q '"persistent":true'; then
                  echo "::notice::배포 확인 완료 (커밋 ${got:-미확인}, 영속 DB)"
                  exit 0
                fi
                echo "::warning::서비스는 떴으나 휘발성 DB 입니다 — DATABASE_URL 을 확인하세요."
                echo "::notice::배포 확인 완료 (휘발성 DB 경고)"
                exit 0
              fi
              echo "아직 이전 리비전(commit=${got:-없음})"
            fi
            sleep 10
          done
          echo "::error::15분 안에 커밋 ${want} 리비전이 응답하지 않았습니다. Render 로그(빌드 실패·기동 실패)를 확인하세요."
          exit 1
