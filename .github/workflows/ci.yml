name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

# PR은 최신 커밋만 검사(이전 실행 취소). main 푸시 run은 취소 금지 —
# 포크 미러 푸시와 Deploy Hook 사이에 취소되면 Render가 stale 상태로 남는다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# 이 워크플로 파일 자체도 포크(hellinii)로 미러된다. 미러는 PAT 푸시라
# 포크에서도 push 이벤트가 발생해 CI가 한 번 더 돈다 — 그런데 포크에는
# FORK_SYNC_TOKEN / RENDER_DEPLOY_HOOK 시크릿이 없어 deploy가 빈 토큰으로
# 자기 자신에게 푸시하다 항상 인증 실패(exit 128)한다. 포크 main은 배포
# 미러일 뿐이고 내용은 이미 팀 repo CI를 통과했으므로, 팀 repo에서만 실행한다.
jobs:
  test:
    if: github.repository == 'hwanginyong02/Capstone_Back'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # render.yaml PYTHON_VERSION=3.12.13과 동일 마이너
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: 의존성 설치
        run: pip install -r requirements-dev.txt # -r requirements.txt 포함
      - name: 테스트
        run: pytest -q
      - name: 앱 부팅 검증 (Render 대시보드 Start Command와 문자 그대로 동일하게 유지할 것)
        env:
          DATABASE_URL: sqlite:///./ci-boot.db
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          UV_PID=$!
          ok=0
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8000/health; then ok=1; break; fi
            sleep 1
          done
          [ "$ok" = "1" ] || { kill $UV_PID; echo "::error::/health 응답 실패"; exit 1; }
          curl -fsS http://localhost:8000/api/organization   # DB init+seed 왕복 스모크
          kill $UV_PID

  # 팀 main 푸시가 CI를 통과했을 때만: 포크(hellinii) main 미러 → Render Deploy Hook.
  # Render는 hellinii/Capstone_Back main을 추적하며 autoDeploy:false 이므로
  # 이 훅 호출이 유일한 배포 경로다. 포크 main은 순수 배포 미러 — 직접 커밋 금지.
  deploy:
    needs: test
    if: >-
      github.repository == 'hwanginyong02/Capstone_Back'
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # shallow clone에서의 push는 GitHub이 거부
          # 기본값(true)이면 GITHUB_TOKEN이 git extraheader로 남아 푸시 URL의
          # FORK_SYNC_TOKEN을 덮어써 403이 난다 — 포크 푸시엔 PAT만 써야 함.
          persist-credentials: false
      - name: 팀 main → 포크 main 미러
        run: |
          if [ -z "${FORK_SYNC_TOKEN}" ]; then
            echo "::error::FORK_SYNC_TOKEN 시크릿이 비어 있습니다. Settings → Secrets and variables → Actions 에서 등록하세요."
            exit 1
          fi
          git push --force \
            "https://x-access-token:${FORK_SYNC_TOKEN}@github.com/hellinii/Capstone_Back.git" \
            HEAD:main
        env:
          FORK_SYNC_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
      - name: Render 배포 트리거
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "${RENDER_DEPLOY_HOOK}" ]; then
            echo "::error::RENDER_DEPLOY_HOOK 시크릿이 비어 있습니다. Settings → Secrets and variables → Actions 에서 등록하세요."
            exit 1
          fi
          curl -fsS -X POST "${RENDER_DEPLOY_HOOK}"
