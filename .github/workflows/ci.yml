name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

# PR은 최신 커밋만 검사(이전 실행 취소). main 푸시 run은 취소 금지 —
# 포크 미러 푸시와 Deploy Hook 사이에 취소되면 Render가 stale 상태로 남는다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # render.yaml PYTHON_VERSION=3.12.13과 동일 마이너
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: 의존성 설치
        run: pip install -r requirements-dev.txt # -r requirements.txt 포함
      - name: 테스트
        run: pytest -q
      - name: 앱 부팅 검증 (Render 대시보드 Start Command와 문자 그대로 동일하게 유지할 것)
        env:
          DATABASE_URL: sqlite:///./ci-boot.db
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          UV_PID=$!
          ok=0
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8000/health; then ok=1; break; fi
            sleep 1
          done
          [ "$ok" = "1" ] || { kill $UV_PID; echo "::error::/health 응답 실패"; exit 1; }
          curl -fsS http://localhost:8000/api/organization   # DB init+seed 왕복 스모크
          # report/report_snapshot 테이블 왕복 스모크.
          # organization 만 치면 report 계열 스키마 드리프트가 그대로 통과한다 —
          # create_all 은 기존 테이블에 컬럼을 추가하지 못하므로(마이그레이션 도구 부재),
          # 그 사고는 배포 후 첫 쿼리에서야 드러난다. 여기서 잡는다.
          curl -fsS -X POST http://localhost:8000/api/reports/issue \
            -H 'Content-Type: application/json' \
            -d '{"run_id":"ci-smoke","model_name":"ci","content":{"smoke":true}}' > /tmp/issued.json
          NO=$(python -c "import json;print(json.load(open('/tmp/issued.json'))['report_no'])")
          curl -fsS "http://localhost:8000/api/reports/${NO}"          # 발급정보 조회
          curl -fsS "http://localhost:8000/api/reports/${NO}/content"  # 성적서 원본 복원
          kill $UV_PID

  # 팀 main 푸시가 CI를 통과했을 때만: 포크(hellinii) main 미러 → Render Deploy Hook.
  # Render는 hellinii/Capstone_Back main을 추적하며 autoDeploy:false 이므로
  # 이 훅 호출이 유일한 배포 경로다. 포크 main은 순수 배포 미러 — 직접 커밋 금지.
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # shallow clone에서의 push는 GitHub이 거부
          # 기본값(true)이면 GITHUB_TOKEN이 git extraheader로 남아 푸시 URL의
          # FORK_SYNC_TOKEN을 덮어써 403이 난다 — 포크 푸시엔 PAT만 써야 함.
          persist-credentials: false
      - name: 팀 main → 포크 main 미러
        run: |
          git push --force \
            "https://x-access-token:${FORK_SYNC_TOKEN}@github.com/hellinii/Capstone_Back.git" \
            HEAD:main
        env:
          FORK_SYNC_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
      - name: Render 배포 트리거
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
