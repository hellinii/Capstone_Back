services:
  - type: web
    name: capstone-back
    runtime: python
    plan: free
    region: singapore          # 사용자·Neon(ap-southeast-1)과 가장 가까움
    branch: main
    autoDeploy: false          # 배포는 CI(deploy job)의 Deploy Hook으로만 — 푸시 자체로는 배포 안 됨
    healthCheckPath: /health
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    # ⚠️ 이 서비스는 대시보드 수동 생성이라 Render는 render.yaml의 startCommand를 쓰지 않고
    #    대시보드 Start Command 값을 쓴다. 이 값은 문서 정합용 — 실제 전환은 대시보드에서 수행.
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13         # 로컬(.venv)과 동일 버전 핀
      - key: DATABASE_URL
        sync: false            # Neon 연결 문자열 — 대시보드에서 입력(커밋 금지)
      - key: OPENAI_API_KEY
        sync: false            # 대시보드에서 입력(커밋 금지)
      # 아래 둘은 기본 꺼짐. 이 파일은 이 서비스에 적용되지 않으므로(위 ⚠️ 참조)
      # 실제로 켜려면 대시보드 Environment 에서 직접 넣어야 한다. 문서 정합용.
      - key: REQUIRE_PERSISTENT_DB
        sync: false            # "1" 이면 SQLite 폴백으로 기동하지 않고 즉시 실패(G-07).
                               # ⚠️ 켜기 전에 DIAG=1 로 /health 를 찍어 현재 backend 를 확인할 것.
                               #    지금 프로덕션이 SQLite 라면 켜는 즉시 서비스가 뜨지 않는다.
      - key: DIAG
        sync: false            # "1" 이면 /health 가 db backend·client_host·X-Forwarded-For 를
                               # 함께 반환(G-07). 관측용이므로 확인 후 다시 끈다.
